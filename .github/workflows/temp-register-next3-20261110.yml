name: Save next three reviewed Met artworks 2026-11-10
on:
  push:
    branches: [codex/museum-complete-next3-20261110]
    paths: [.github/workflows/temp-register-next3-20261110.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install JPEG decode library
        run: pip install "Pillow>=11,<13"
      - name: Set GitHub Actions commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Complete each artwork with version-bound separate audit and mandatory preview save check
        run: python scripts/tmp_complete_three_followup_20261110.py
