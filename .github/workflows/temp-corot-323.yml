name: Temporary audited Corot 323 registration
on:
  push:
    branches: [codex/expand-artwork-323-corot-20261110]
    paths: ['.github/workflows/temp-corot-323.yml']
permissions:
  contents: write
jobs:
  register-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current candidate branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Save version-bound evidence and official-text audit
        run: |
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          ident='met-435991'
          url='https://www.metmuseum.org/art/collection/search/435991'
          api='https://collectionapi.metmuseum.org/public/collection/v1/objects/435991'
          oa='https://www.metmuseum.org/hubs/open-access'
          origin='https://images.metmuseum.org/CRDImages/ep/original/DP-16589-001.jpg'
          display='https://images.metmuseum.org/CRDImages/ep/web-large/DP-16589-001.jpg'
          run='https://github.com/matumaruex/kaiga-data/actions/runs/42802438308'
          cp=Path('drafts/artwork-additions/'+ident+'.json')
          dp=Path('drafts/visitor-explanations/'+ident+'.json')
          candidate=json.loads(cp.read_text(encoding='utf-8'))
          art=candidate['artwork']
          def shafile(p):return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          assert art['id']==ident and art['source']['artwork_id']==435991
          assert art['image']['high_resolution']['sha256']=='8408e849f433f0f42f3c8e7975f9b62beabe363d447f08e348863a7cffd19b85'
          assert art['image']['sha256']=='01636f97776dc6101f6f7f2f0883914b7ced510a662f693e8f2577f76c27226a'
          audit={
            'schema_version':'artwork-v2-new-registration-2','id':ident,
            'checked_on':'2026-11-10','result':'PASS','unresolved_material_issues':[],
            'candidate_path':str(cp),'candidate_sha256':shafile(cp),
            'draft_path':str(dp),'draft_sha256':shafile(dp),
            'baseline':{'artworks_sha256':shafile('data/artworks.json'),'image_registry_sha256':shafile('data/image-sources.json')},
            'official_text_checks':[
              {'source_url':url,'source_section':'Overview, opening sentence: Corot and the Salon of 1869',
               'source_excerpt':'When the seventy-two-year-old Corot showed A Woman Reading at the Salon of 1869',
               'visitor_claim':'風景画で知られるコローは、1869年、この作品をパリのサロンに出品しました'},
              {'source_url':url,'source_section':'Overview, critic Théophile Gautier assessment',
               'source_excerpt':'praised its naïveté and its color but criticized the faulty drawing of the woman',
               'visitor_claim':'批評家テオフィル・ゴーティエは色彩を評価する一方、女性の描き方には不備があると評しました'},
              {'source_url':url,'source_section':'Overview, final sentence: landscape repainted and figure retained',
               'source_excerpt':'he reworked the landscape but left the figure intact',
               'visitor_claim':'メトロポリタン美術館によれば、コローはその後、人物は変えず、背景の風景を描き直しました'}
            ],
            'source_evidence':[
              {'url':url,'location':'Artwork Details and full Overview; first/only paragraph, Salon 1869, Gautier response and later landscape revisions',
               'finding':'Met Overview says the painter exhibited the work at Salon 1869, rare among his publicly exhibited figure studies; Théophile Gautier praised color and naïveté but found the female figure drawing faulty. The artist later repainted the landscape while retaining the figure. Exact quotes bound to three Japanese claims.', 'checked_against_source':True},
              {'url':api,'location':'Official Met object API: objectID 435991, accession 28.90, artist, objectDate, classification, PD and primary-image URLs',
               'finding':'Actual Met API checked in '+run+'; full original 2926x4000 and web-large 457x625 JPEG SHA256/bytes; same-image downscale RMS 4.3086. Met API culture field is empty; artist nationality is not presented as work culture.','checked_against_source':True},
              {'url':oa,'location':'Met Open Access: CC0 images and basic data of public-domain works',
               'finding':'Met grants CC0 use of official PD work images and basic object data; modern Met prose is not covered by image CC0.','checked_against_source':True}
            ],
            'rights':{
              'artwork':{'verified':True,'public_domain':True,'source_url':url,'finding':'Met exact object marked Public Domain; creator died 1875.'},
              'image':{'verified':True,'permitted_for_site_use':True,'source_url':oa,'finding':'Met CC0 for Open Access public-domain object images; exact primary JPEGs were downloaded and hashed.'},
              'text':{'verified':True,'independent_japanese_prose':True,'source_url':url,'finding':'New Japanese text independently worded from facts and observation, not a translation or lengthy copy; not a legal guarantee.'}
            },
            'separate_pass_review':{
              'result':'PASS',
              'method':'Same assistant separate evidence check: reread exact Met Overview and Details; compared the painter, Salon date, critic and revised sections against the drafted Japanese text; examined the official Met IIIF image, checked the official Met object API, full original/display hashes, dimensions and RGB downscale RMS in '+run,
              'limitations':'Not a separate human or independent scholarly expert. Website HTML accessible for direct inspection; CI re-fetch may encounter 429. The figure’s mental state and the changes’ precise microscopic locations are not verified. No legal clearance opinion.',
              'areas':['identity','image_match','historical_interpretation','emotion','visitor_text','rights'],
              'findings':{
                'identity':'Met object 435991, Corot, A Woman Reading, 1869 and 1870, accession 28.90; painting not confused with other Corot readers.',
                'image_match':'Met IIIF for same object displays woman in blue-sleeved bodice reading outdoors; official primaryJPEG and web-large RMS 4.3086, URLs and hashes in run '+run,
                'historical_interpretation':'Met Overview confirms Salon 1869, Gautier color praise and figure criticism, and that Corot reworked landscape but not figure. Do not assert unknown thought, text of book, or psychological intent.',
                'emotion':'Only secondary 好奇心 (strength 1), a tentative viewer association; no claim about the woman's feelings.',
                'visitor_text':'Three central historical claims linked to short exact Met-source excerpts. Visual observations are visible in Met official IIIF artwork image.',
                'rights':'Specific painting PD, Met Open Access image CC0, distinct original explanatory prose.'
              }
            },
            'image_evidence':[
              {'kind':'display','url':display,
               'sha256':'01636f97776dc6101f6f7f2f0883914b7ced510a662f693e8f2577f76c27226a',
               'byte_length':96559,'download_status':200,'full_bytes_sha256_checked':True,
               'image_subject_visually_compared':True,
               'observation':'The official ID 435991 IIIF image depicts a seated, dark-haired woman with blue sleeves reading outdoors. Primary image exact web-large bytes SHA256 and dimensions independently verified in '+run+'; downscale RMS 4.3086.',
               'checked_on':'2026-11-10'},
              {'kind':'original','url':origin,
               'sha256':'8408e849f433f0f42f3c8e7975f9b62beabe363d447f08e348863a7cffd19b85',
               'byte_length':3389355,'download_status':200,'full_bytes_sha256_checked':True,
               'image_subject_visually_compared':True,
               'observation':'Met official original matching same subject and exact object API primaryImage. Full JPEG SHA256 2926x4000, resized to 457x625 with RMS 4.3086 against display, '+run,
               'checked_on':'2026-11-10'}
            ],
            'notes':['One newly researched artwork, existing 322 records preserved.','Same assistant separate pass is not independent human review; app-publication timing and future image license issues separate.']
          }
          ap=Path('docs/artwork-completion-audits/'+ident+'-2026-11-10.json')
          ap.write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('AUDIT_CREATED='+str(ap)+' baseline_sha='+audit['baseline']['artworks_sha256'])
          PY
      - name: Preview then save one completed artwork
        run: |
          python3 scripts/verify_official_source_text.py --audit docs/artwork-completion-audits/met-435991-2026-11-10.json
          python3 scripts/add_artwork.py preview --audit docs/artwork-completion-audits/met-435991-2026-11-10.json
          python3 scripts/add_artwork.py save --audit docs/artwork-completion-audits/met-435991-2026-11-10.json
          python3 scripts/add_artwork.py check
      - name: Rotate restart memo for 323 works
        run: |
          cat > /tmp/kaiga-323-resume.md <<'EOF'
          ## 現在の状態（2026-11-10時点）
          
          - **完成登録：323作品**。正式数は最新 `main` の `data/artworks.json` とREADMEを確認する。
          - **次：324作品目から候補調査**。既存の完成作品を再登録しない。
          - 323番目は `met-435991`（Camille Corot, *A Woman Reading*, 1869 and 1870）。Metの作品別Overviewと公式画像を照合し、独自日本語解説・v2監査に登録。
          - Met APIの原寸／表示JPEGを完全SHA256・サイズ・縮小RMSで照合（[GitHub Actionsの検証](https://github.com/matumaruex/kaiga-data/actions/runs/42802438308)）。同AIの別工程審査であり人間の外部審査ではない。
          - 従来の322件と各監査は不変。新規は [追加ガイド](artwork-expansion-v2.md) と [共通基準](artwork-completion-workflow-v2.md) に従う。
          EOF
          python3 scripts/rotate_resume.py update --from /tmp/kaiga-323-resume.md
      - name: Run final structural and integrity checks
        run: |
          python3 scripts/validate_artworks.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/rotate_resume.py check
          python3 scripts/complete_artwork.py check
          python3 scripts/add_artwork.py check
          python3 scripts/visitor_draft_queue.py check
          python3 scripts/check_catalog_snapshot.py
          python3 scripts/check_image_sources.py
          python3 scripts/validate_evaluation_cases.py
          python3 scripts/verify_target_image_live.py --id met-435991
      - name: Commit vetted data on this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/artworks.json data/image-sources.json docs/artwork-completion-audits/met-435991-2026-11-10.json docs/resume-artwork-work.md docs/history/resume-updates.md
          git diff --cached --check
          git diff --cached --stat
          git commit -m "data: Add Met Corot A Woman Reading as work 323"
          git push origin HEAD:codex/expand-artwork-323-corot-20261110
