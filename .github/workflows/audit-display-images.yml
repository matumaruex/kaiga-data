name: Inspect artwork image dimensions
on:
  push:
    paths:
      - "scripts/audit_image_dimensions.py"
      - ".github/workflows/audit-display-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-images:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out artwork data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install image inspection dependencies
        run: python -m pip install "Pillow>=11,<13"
      - name: Download and decode all 300 catalog display images
        run: python scripts/audit_image_dimensions.py
      - name: Keep image contact sheets for visual spot-checking
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: art-image-contact-sheets
          path: artifacts/image-contact-sheets/*.jpg
          if-no-files-found: ignore
          retention-days: 14
      - name: Keep full machine-readable audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artwork-image-dimensions
          path: |
            docs/image-dimensions-audit.json
            docs/image-dimensions-audit.md
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit quality audit report
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/image-dimensions-audit.json docs/image-dimensions-audit.md
          if ! git diff --cached --quiet; then
            git commit -m "300作品の解像度・画像完全性の監査結果を記録"
            git pull --rebase
            git push
          fi
