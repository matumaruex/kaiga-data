name: One-off Met artworks 435-437 registration
on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp_register_435_437.yml
      - scripts/tmp_register_435_437.py
      - scripts/tmp_specs_435_437.json
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out current research branch
        uses: actions/checkout@v4
        with:
          ref: codex/artworks-435-437-20261113
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image inspection dependencies
        run: python -m pip install pillow requests
      - name: Research exact primary JPEGs and register three approved source-specific artworks
        run: python scripts/tmp_register_435_437.py
