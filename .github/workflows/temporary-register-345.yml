name: Temporary audited artwork registration 345-347
on:
  push:
    branches: [codex/expand-artworks-345-347-20261111]
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet requests pillow
      - name: Register three individually audited Met artworks and run all quality gates
        run: |
          python -m py_compile scripts/_temporary_register_345_347.py
          python scripts/_temporary_register_345_347.py
