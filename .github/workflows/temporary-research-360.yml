name: Temporary Met open-access image and duplicate research 360-362
on:
  push:
    branches: [codex/expand-artworks-360-362-20261111]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet requests pillow
      - name: Match official objects and full primary JPEGs with live image previews
        shell: bash
        run: |
          python - <<'PY'
          import json,requests,io,hashlib,math,time,base64
          from PIL import Image,ImageStat,ImageChops
          ids=[441356,45770,676034,57166]
          old=json.load(open('data/artworks.json'))['artworks']
          registry=json.load(open('data/image-sources.json'))['records']
          assert len(old)==359
          def get(url):
           for n in range(5):
            try:
             r=requests.get(url,timeout=65,headers={'User-Agent':'MuseumCatalogQualityCheck/1.0'})
             if r.status_code==200:return r
             print('HTTP',r.status_code,url,flush=True)
            except Exception as e:print('RETRY_ERR',str(e)[:120],flush=True)
            time.sleep(2+n*2)
           raise ValueError('fetch failed '+url)
          for n in ids:
           try:
            o=get(f'https://collectionapi.metmuseum.org/public/collection/v1/objects/{n}').json()
            d={'id':f'met-{n}','title':o.get('title'),'artist':o.get('artistDisplayName'),'date':o.get('objectDate'),
               'medium':o.get('medium'),'classification':o.get('classification'),'department':o.get('department'),
               'culture':o.get('culture'),'accession':o.get('accessionNumber'),'isPublicDomain':o.get('isPublicDomain'),
               'id_duplicates':[v['id'] for v in old if v['id']==f'met-{n}'],
               'title_artist_duplicates':[v['id'] for v in old if v['facts']['title_original']==o.get('title') and v['facts']['artist']==o.get('artistDisplayName')]}
            print('CANDIDATE_META',json.dumps(d,ensure_ascii=False),flush=True)
            assert o['objectID']==n and o['isPublicDomain'] is True and not d['id_duplicates'] and not d['title_artist_duplicates']
            assert o['classification']=='Paintings' or (n in (764090,764094) and o['department']=='The American Wing' and o['medium']=='Oil on canvas')
            images={};im={}
            for kind,key in [('original','primaryImage'),('display','primaryImageSmall')]:
             url=o.get(key,'')
             assert url.startswith('https://images.metmuseum.org/')
             raw=get(url).content
             pic=Image.open(io.BytesIO(raw));pic.load()
             assert pic.format=='JPEG'
             im[kind]=pic.convert('RGB')
             images[kind]={'url':url,'sha256':hashlib.sha256(raw).hexdigest(),'byte_length':len(raw),'width':pic.width,'height':pic.height}
            rms=math.sqrt(sum(x*x for x in ImageStat.Stat(ImageChops.difference(im['original'].resize(im['display'].size,Image.Resampling.LANCZOS),im['display'])).rms)/3)
            d['images']=images;d['downscale_rms']=round(rms,5)
            d['duplicate_image_sha']=[v['id'] for v in old if v['image']['sha256']==images['display']['sha256']]
            assert rms<30 and not d['duplicate_image_sha']
            print('CANDIDATE_PASS',json.dumps(d,ensure_ascii=False),flush=True)
            thumb=im['display'].copy();thumb.thumbnail((270,270))
            buf=io.BytesIO();thumb.save(buf,format='JPEG',quality=54,optimize=True)
            print('THUMB',n,base64.b64encode(buf.getvalue()).decode(),flush=True)
           except Exception as e:print('CANDIDATE_HOLD',n,repr(e),flush=True)
          PY