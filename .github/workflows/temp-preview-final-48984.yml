name: Verify exact Met 48984 artwork original 2026-11-10
on:
  push:
    branches: [codex/museum-complete-final-48984-20261110]
    paths: [.github/workflows/temp-preview-final-48984.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install "Pillow>=11,<13"
      - name: Re-download source and reviewable original preview
        run: |
          python - <<'PY'
          import hashlib,io,json,base64,urllib.request
          from PIL import Image
          a=next(x for x in json.load(open('data/artworks.json'))['artworks'] if x['id']=='met-48984')
          src=a['image']['high_resolution']
          req=urllib.request.Request(src['url'],headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=55) as resp:raw=resp.read()
          sha=hashlib.sha256(raw).hexdigest()
          print('AUDIT_SOURCE met-48984 bytes='+str(len(raw))+' sha256='+sha+' registered_match='+str(sha==src['sha256']),flush=True)
          assert sha==src['sha256']
          frame=Image.open(io.BytesIO(raw)).convert('RGB');print('AUDIT_DIMENSIONS '+str(frame.size),flush=True)
          assert frame.size==(src['width'],src['height'])
          frame.thumbnail((800,800))
          b=io.BytesIO();frame.save(b,format='JPEG',quality=76,optimize=True)
          enc=base64.b64encode(b.getvalue()).decode('ascii')
          print('AUDIT_JPEG_BEGIN',flush=True)
          for i in range(0,len(enc),800):print(enc[i:i+800],flush=True)
          print('AUDIT_JPEG_END',flush=True)
          PY
