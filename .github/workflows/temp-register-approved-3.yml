name: Temporary register approved Met works 308 to 310
on:
  push:
    branches: [codex/museum-approved-308-310-20261110]
    paths: [.github/workflows/temp-register-approved-3.yml]
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow
      - name: Independently check official JPEGs and register one artwork at a time
        run: python scripts/temp_register_approved_3.py
