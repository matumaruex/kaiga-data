name: Inspect next three registered original Met images 2026-11-10
on:
  push:
    branches: [codex/museum-complete-next3-20261110]
    paths: [.github/workflows/temp-preview-next3-20261110.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install "Pillow>=11,<13"
      - name: Verify exact registered originals and output visual previews
        run: |
          python - <<'PY'
          import base64,hashlib,io,json,urllib.request
          from PIL import Image
          by_id={a['id']:a for a in json.load(open('data/artworks.json'))['artworks']}
          for ident in ('met-45697','met-670921','met-436680'):
              a=by_id[ident];src=a['image'].get('high_resolution') or a['image'];url=src.get('url') or src['display_url']
              print('INSPECT_START '+ident,flush=True)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=50) as resp: raw=resp.read()
                  h=hashlib.sha256(raw).hexdigest()
                  print('INSPECT_SOURCE '+ident+' bytes='+str(len(raw))+' sha256='+h+' registered_match='+str(h==src['sha256']),flush=True)
                  frame=Image.open(io.BytesIO(raw)).convert('RGB')
                  print('INSPECT_SIZE '+ident+' '+str(frame.size),flush=True)
                  frame.thumbnail((720,720))
                  out=io.BytesIO();frame.save(out,format='JPEG',quality=70,optimize=True)
                  encoded=base64.b64encode(out.getvalue()).decode('ascii')
                  print('INSPECT_JPEG_BEGIN '+ident,flush=True)
                  for i in range(0,len(encoded),800):print(encoded[i:i+800],flush=True)
                  print('INSPECT_JPEG_END '+ident,flush=True)
              except Exception as exc:print('INSPECT_FAILED '+ident+' '+repr(exc),flush=True)
              print('INSPECT_END '+ident,flush=True)
          PY
