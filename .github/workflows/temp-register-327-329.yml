name: Temporary audited registration 327-329
on:
  push:
    branches: [codex/expand-artworks-327-329-20261111]
    paths: ['.github/workflows/temp-register-327-329.yml']
permissions:
  contents: write
jobs:
  register-audited-three:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Audit, preview, save, and full-validate each of three works
        run: python3 scripts/temp-register-327-329.py
      - name: Commit vetted data, drafts, audits and resume status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/artworks.json data/image-sources.json \
            drafts/artwork-additions/met-49471.json drafts/artwork-additions/met-747199.json drafts/artwork-additions/met-456966.json \
            drafts/visitor-explanations/met-49471.json drafts/visitor-explanations/met-747199.json drafts/visitor-explanations/met-456966.json \
            docs/artwork-completion-audits/met-49471-2026-11-11.json docs/artwork-completion-audits/met-747199-2026-11-11.json docs/artwork-completion-audits/met-456966-2026-11-11.json \
            docs/resume-artwork-work.md docs/history/resume-updates.md
          git diff --cached --check
          git diff --cached --stat
          git commit -m "data: Register source-audited Met artworks 327-329"
          git push origin HEAD:codex/expand-artworks-327-329-20261111
