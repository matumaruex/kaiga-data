name: Temporary audited Met registration 348-350
on:
  push:
    branches: [codex/expand-artworks-348-350-20261111]
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet requests pillow
      - name: Run three version-bound artwork registrations and all tests
        run: |
          python -m py_compile scripts/_temporary_register_348_350.py
          python scripts/_temporary_register_348_350.py
