name: Discover batch 019 paintings
on:
  push:
    paths:
      - "scripts/discover_batch019.py"
      - ".github/workflows/discover-batch019.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python3 scripts/discover_batch019.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch019-discovery
          path: artifacts/batch019-discovery.json
          if-no-files-found: warn
