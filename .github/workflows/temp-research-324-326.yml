name: Temporary research 324-326
on:
  push:
    branches: [codex/expand-artworks-324-326-20261110]
    paths: ['.github/workflows/temp-research-324-326.yml']
permissions:
  contents: read
jobs:
  verify-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - name: Source, duplicate, full JPEG and downscale identity checks
        run: |
          python3 - <<'PY'
          import hashlib,io,json,urllib.request,math
          from PIL import Image,ImageChops,ImageStat
          existing=json.load(open('data/artworks.json'))['artworks']
          existing_ids={x['id'] for x in existing}
          existing_images={x['image'].get('sha256') for x in existing}
          existing_titles={(x['facts']['title_original'],x['facts']['artist']) for x in existing}
          targets=[764090,77180,701989]
          def fetch(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (museum-data research; academic)'})
            with urllib.request.urlopen(req,timeout=60) as r:
              assert r.status==200
              return r.read()
          for oid in targets:
            ident=f'met-{oid}'
            assert ident not in existing_ids, 'duplicate ID '+ident
            ob=json.loads(fetch(f'https://collectionapi.metmuseum.org/public/collection/v1/objects/{oid}'))
            assert ob['objectID']==oid and ob['isPublicDomain'] and ob['primaryImage']
            assert (ob['title'],ob['artistDisplayName']) not in existing_titles
            meta={k:ob.get(k) for k in ('objectID','title','artistDisplayName','objectDate','classification','medium','culture','accessionNumber','isPublicDomain','primaryImage','primaryImageSmall')}
            print('MET_OBJECT='+json.dumps(meta,ensure_ascii=False),flush=True)
            original=ob['primaryImage']
            display=ob.get('primaryImageSmall') or original.replace('/original/','/web-large/')
            assert original!=display and '/original/' in original and '/web-large/' in display
            im={}
            for kind,url in [('original',original),('display',display)]:
              raw=fetch(url)
              assert raw.startswith(b'\xff\xd8') and raw.endswith(b'\xff\xd9'), 'JPEG bounds '+ident
              p=Image.open(io.BytesIO(raw))
              p.load()
              assert p.format=='JPEG'
              checksum=hashlib.sha256(raw).hexdigest()
              assert checksum not in existing_images, 'same image in DB '+ident
              im[kind]=p.convert('RGB')
              result={'id':ident,'kind':kind,'url':url,'sha256':checksum,'byte_length':len(raw),'width':p.width,'height':p.height,'http_status':200}
              print('MET_IMAGE='+json.dumps(result,ensure_ascii=False),flush=True)
            resized=im['original'].resize(im['display'].size,Image.Resampling.LANCZOS)
            rms=math.sqrt(sum(v*v for v in ImageStat.Stat(ImageChops.difference(resized,im['display'])).rms)/3)
            print('DOWNSCALE='+json.dumps({'id':ident,'rms':round(rms,4)}),flush=True)
            assert rms<35,'same image downscale failed '+ident
          print('ALL_CANDIDATES_VERIFIED: 3 official Met objects / 6 image files / current DB no duplicate',flush=True)
          PY
