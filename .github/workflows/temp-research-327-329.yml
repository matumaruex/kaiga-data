name: Temporary image research 327-329
on:
  push:
    branches: [codex/expand-artworks-327-329-20261111]
    paths: ['.github/workflows/temp-research-327-329.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - name: Verify official Met records and all image bytes
        run: |
          python3 - <<'PY'
          import hashlib,io,json,urllib.request,math
          from PIL import Image,ImageChops,ImageStat
          objects=[49471,747199,456966]
          existing=json.load(open('data/artworks.json'))['artworks']
          haveids={x['id'] for x in existing}
          havetitleartist={(x['facts']['title_original'],x['facts']['artist']) for x in existing}
          havehash={x['image'].get('sha256') for x in existing}
          def fetch(url):
            request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (educational museum data research)'})
            with urllib.request.urlopen(request,timeout=65) as f:
              assert f.status==200
              return f.read()
          for oid in objects:
            ident='met-'+str(oid)
            assert ident not in haveids,'existing ID: '+ident
            data=json.loads(fetch(f'https://collectionapi.metmuseum.org/public/collection/v1/objects/{oid}'))
            assert data.get('objectID')==oid and data.get('isPublicDomain') is True and data.get('primaryImage'),'official metadata/PD/image missing'
            assert (data.get('title'),data.get('artistDisplayName')) not in havetitleartist,'existing title/artist'
            meta={k:data.get(k) for k in ('objectID','title','artistDisplayName','objectDate','classification','medium','culture','accessionNumber','isPublicDomain','primaryImage','primaryImageSmall')}
            print('OBJECT '+json.dumps(meta,ensure_ascii=False),flush=True)
            orig=data['primaryImage']
            small=data.get('primaryImageSmall') or orig.replace('/original/','/web-large/')
            assert small and small!=orig
            images={}
            for typ,url in [('original',orig),('display',small)]:
              b=fetch(url)
              assert b[:2]==b'\xff\xd8' and b[-2:]==b'\xff\xd9'
              pic=Image.open(io.BytesIO(b));pic.load()
              assert pic.format=='JPEG'
              sha=hashlib.sha256(b).hexdigest()
              assert sha not in havehash
              images[typ]=pic.convert('RGB')
              print('IMAGE '+json.dumps({'id':ident,'kind':typ,'url':url,'sha256':sha,'byte_length':len(b),'width':pic.width,'height':pic.height,'http_status':200},ensure_ascii=False),flush=True)
            down=images['original'].resize(images['display'].size,Image.Resampling.LANCZOS)
            rms=math.sqrt(sum(v*v for v in ImageStat.Stat(ImageChops.difference(down,images['display'])).rms)/3)
            print('DOWNSCALE '+json.dumps({'id':ident,'rms':round(rms,5)}),flush=True)
            assert rms<35,'same object resized JPEG mismatch'
          print('PASS verified 3 distinct object IDs, PD, 6 complete images and corresponding resizing',flush=True)
          PY
