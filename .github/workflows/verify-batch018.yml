name: Verify batch 018 Met metadata and JPEGs
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/research_batch018.py"
      - "data/candidates-batch-018.json"
      - ".github/workflows/verify-batch018.yml"
permissions:
  contents: read
jobs:
  audit-met-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify 18 Met Object API records and official JPEG bytes
        run: python3 scripts/research_batch018.py
      - name: Upload audit JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch018-source-proof
          path: artifacts/batch018-live-check.json
          if-no-files-found: warn
          retention-days: 30
