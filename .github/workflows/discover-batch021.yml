name: Discover batch 021 paintings
on:
  push:
    paths:
      - "scripts/discover_batch021.py"
      - ".github/workflows/discover-batch021.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python3 scripts/discover_batch021.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch021-painting-discovery
          path: artifacts/batch021-discovery.json
