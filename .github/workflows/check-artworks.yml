  research-batch010-priority:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[research-batch010-priority]')
    needs: validate-format
    runs-on: ubuntu-latest
    timeout-minutes: 14
    permissions:
      contents: write
    steps:
      - name: Checkout research data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify 18 priority records and primary JPEGs
        run: python3 scripts/research_batch010_priority.py --online
      - name: Save verification report to main
        if: always()
        run: |
          test -s docs/batch010-priority-result.json || exit 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/batch010-priority-result.json
          git diff --cached --quiet || git commit -m "第10群優先18件のオンライン画像検証結果"
          git pull --rebase
          git push
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch010-priority-jpeg-hashes
          path: docs/batch010-priority-result.json
          if-no-files-found: ignore
          retention-days: 14

  research-batch011:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[research-batch011]')
    needs: validate-format
    runs-on: ubuntu-latest
    timeout-minutes: 13
    permissions:
