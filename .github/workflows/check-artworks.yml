        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Research Met official API and JPG without making changes
        run: python3 scripts/research_batch013.py
      - name: Save report as an artifact
        if: always()
