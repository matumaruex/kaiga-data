name: Check artwork data

on:
  workflow_dispatch:
  push:
    paths:
      - "data/**"
      - "scripts/**"
      - ".github/workflows/check-artworks.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout dataset
        uses: actions/checkout@11bd71901bbe5b1630ceea73b27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify exhibition records format
        run: python3 scripts/validate_artworks.py
      - name: Verify candidate records format
        run: python3 scripts/validate_candidates.py
      - name: Verify candidate metadata with live museum API (read-only)
        run: python3 scripts/enrich_candidates.py
