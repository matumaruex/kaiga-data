name: Check artwork data

on:
  workflow_dispatch:
  push:
    paths:
      - "data/**"
      - "scripts/**"
      - "tests/**"
      - "drafts/**"
      - "docs/artwork-completion-audits/**"
      - "docs/resume-artwork-work.md"
      - "docs/history/resume-updates.md"
      - ".github/workflows/check-artworks.yml"

permissions:
  contents: read

jobs:
  validate-format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout dataset
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify requested target JPEGs against saved hashes
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-target:')
        env:
          CHECK_MESSAGE: ${{ github.event.head_commit.message }}
        run: python3 scripts/verify_target_image_live.py --commit-message "$CHECK_MESSAGE"
      - name: Preserve target JPEG check evidence
        if: always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-target:')
        uses: actions/upload-artifact@v4
        with:
          name: target-jpeg-check
          path: artifacts/verified-target-image.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify exhibition data structure
        run: python3 scripts/validate_artworks.py
      - name: Test registration guards
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Keep restart note short and archived
        run: python3 scripts/rotate_resume.py check
      - name: Verify saved v2 completion evidence
        run: python3 scripts/complete_artwork.py check
      - name: Verify v2 additions and their image/source/audit bindings
        run: python3 scripts/add_artwork.py check
      - name: Verify visitor drafts
        run: python3 scripts/visitor_draft_queue.py check
      - name: Verify original 300-work baseline, growth and interrupted-edit guards
        run: python3 scripts/check_catalog_snapshot.py
      - name: Verify candidate data structure
        run: python3 scripts/validate_candidates.py
      - name: Verify alternative-image registry
        run: python3 scripts/check_image_sources.py
      - name: Validate selection test cases
        run: python3 scripts/validate_evaluation_cases.py
      - name: Report emotion coverage
        run: python3 scripts/audit_coverage.py

  verify-live-source:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-live]')
    needs: validate-format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout dataset
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify official metadata and download JPEG samples (read-only)
        run: python3 scripts/verify_live_assets.py --require-all
      - name: Save online verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-artwork-verification
          path: artifacts/live-artwork-check.json
          if-no-files-found: ignore
          retention-days: 14

  probe-image-hosts:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[probe-hosts]')
    needs: validate-format
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout dataset
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Test public image delivery for potential future museums
        run: python3 scripts/probe_image_hosts.py

  verify-image-sources:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-images]')
    needs: validate-format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout dataset
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Check Commons and pinned image sources live
        run: python3 scripts/check_image_sources.py --online --require-all --output-dir artifacts/checked-artwork-images
      - name: Package validated JPEGs for both museum apps
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: validated-artwork-jpegs
          path: artifacts/checked-artwork-images/*.jpg
          if-no-files-found: error
          retention-days: 14
      - name: Save verified source report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checked-image-sources
          path: artifacts/verified-image-sources.json
          if-no-files-found: ignore
          retention-days: 14


  # Record the core validation outcome as a classic commit status.
  # ChatGPT's GitHub connector can read commit statuses without a workflow-run ID.
  publish-validation-status:
    name: Publish catalog validation status
    if: ${{ always() }}
    needs: [validate-format]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      statuses: write
    steps:
      - name: Report validation result to commit status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATION_RESULT: ${{ needs.validate-format.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$VALIDATION_RESULT" = "success" ]; then
            STATE=success
            DESCRIPTION="Artworks structural checks passed"
          else
            STATE=failure
            DESCRIPTION="Artworks structural checks did not pass"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context="museum-data/validate-format" \
            -f description="$DESCRIPTION" \
            -f target_url="$RUN_URL"
