name: Check artwork data

on:
  workflow_dispatch:
  push:
    paths:
      - "data/**"
      - "scripts/**"
      - ".github/workflows/check-artworks.yml"

permissions:
  contents: read

jobs:
  validate-format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout dataset
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify exhibition data structure
        run: python3 scripts/validate_artworks.py
      - name: Verify candidate data structure
        run: python3 scripts/validate_candidates.py
      - name: Verify batch-003 candidate structure
        run: python3 scripts/validate_batch003.py
      - name: Verify batch-004 candidate structure
        run: python3 scripts/validate_batch004.py
      - name: Verify batch-005 candidate structure
        run: python3 scripts/validate_batch005.py
      - name: Verify batch-006 candidate structure
        run: python3 scripts/research_batch006.py
      - name: Verify alternative-image registry
        run: python3 scripts/check_image_sources.py
      - name: Validate selection test cases
        run: python3 scripts/validate_evaluation_cases.py
      - name: Report emotion coverage
        run: python3 scripts/audit_coverage.py

  verify-live-source:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-live]')
    needs: validate-format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout dataset
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify official metadata and download JPEG samples (read-only)
        run: python3 scripts/verify_live_assets.py --require-all
      - name: Save online verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-artwork-verification
          path: artifacts/live-artwork-check.json
          if-no-files-found: ignore
          retention-days: 14

  probe-image-hosts:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[probe-hosts]')
    needs: validate-format
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout dataset
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Test public image delivery for potential future museums
        run: python3 scripts/probe_image_hosts.py

  verify-image-sources:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-images]')
    needs: validate-format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout dataset
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Check Commons and pinned image sources live
        run: python3 scripts/check_image_sources.py --online --require-all --output-dir artifacts/checked-artwork-images
      - name: Package validated JPEGs for both museum apps
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: validated-artwork-jpegs
          path: artifacts/checked-artwork-images/*.jpg
          if-no-files-found: error
          retention-days: 14
      - name: Save verified source report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checked-image-sources
          path: artifacts/verified-image-sources.json
          if-no-files-found: ignore
          retention-days: 14

  verify-batch003-official-api:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-batch003]')
    needs: validate-format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout dataset
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Check current official AIC metadata for next 5 works
        run: python3 scripts/validate_batch003.py --online --require-all
      - name: Save batch003 verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch003-official-metadata
          path: artifacts/batch003-api-check.json
          if-no-files-found: ignore
          retention-days: 14

  verify-batch004-official-and-commons:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-batch004]')
    needs: validate-format
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout dataset
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Live official API and Commons artwork JPEG verification
        run: python3 scripts/validate_batch004.py --online --require-all
      - name: Save batch004 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch004-official-image-report
          path: artifacts/batch004-live-verification.json
          if-no-files-found: ignore
          retention-days: 14

  research-batch005-official-commons:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[research-batch005]')
    needs: validate-format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout dataset
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Research AIC official records and Commons JPEGs for batch 005
        run: python3 scripts/validate_batch005.py --online --only-accessions "1933.1158,1922.433,1922.436,1922.434,1959.636"
      - name: Save batch005 research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch005-research-report
          path: artifacts/batch005-research.json
          if-no-files-found: ignore
          retention-days: 14

  research-batch006:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[research-batch006]')
    needs: validate-format
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout dataset
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Research 10 candidates against AIC and Commons
        run: python3 scripts/research_batch006.py --online --only-titles 'The Death of Orpheus;The Expulsion of Adam and Eve from Paradise;Woman at the Piano'
      - name: Save official and image research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch006-research-results
          path: artifacts/batch006-research.json
          if-no-files-found: ignore
          retention-days: 14
