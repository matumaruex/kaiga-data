        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify 10 Met records and original JPEGs
        run: python3 scripts/research_batch011.py
      - name: Save official metadata and exact image evidence
        if: always()
        run: |
          test -s docs/batch011-online-result.json || exit 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/batch011-online-result.json
          git diff --cached --quiet || git commit -m "第11群・公式APIとJPEG検証結果を記録"
