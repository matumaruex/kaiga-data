name: Temporary Met survey 372-374
on:
  push:
    branches: [codex/expand-artworks-372-374-20261111]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet requests pillow
      - name: Verify museum object identities, rights, duplicate absence, original/display JPEG and preview
        run: |
          python - <<'PY'
          import json,requests,io,hashlib,math,time,base64
          from PIL import Image,ImageChops,ImageStat
          ids=[764087,438007,37895,49132,49079]
          old=json.load(open('data/artworks.json'))['artworks']
          assert len(old)==371
          def get(url):
           for attempt in range(5):
            try:
             r=requests.get(url,timeout=72,headers={'User-Agent':'OpenArtCatalogSourceVerifier/1.0'})
             if r.status_code==200:return r
             print('HTTP',r.status_code,url,flush=True)
            except Exception as ex: print('FETCH_ERR',str(ex)[:150],flush=True)
            time.sleep(2+attempt*2)
           raise RuntimeError('could not fetch '+url)
          for n in ids:
           try:
            obj=get('https://collectionapi.metmuseum.org/public/collection/v1/objects/'+str(n)).json()
            d={'id':'met-'+str(n),'title':obj.get('title'),'artist':obj.get('artistDisplayName'),
             'date':obj.get('objectDate'),'culture':obj.get('culture'),'medium':obj.get('medium'),
             'classification':obj.get('classification'),'department':obj.get('department'),
             'accession':obj.get('accessionNumber'),'publicDomain':obj.get('isPublicDomain'),
             'dupe_id':[v['id'] for v in old if v['id']==f'met-{n}'],
             'dupe_title_artist':[v['id'] for v in old if v['facts']['title_original']==obj.get('title') and v['facts']['artist']==obj.get('artistDisplayName')]}
            print('CANDIDATE_META',json.dumps(d,ensure_ascii=False),flush=True)
            assert obj['objectID']==n and obj['isPublicDomain'] is True and not d['dupe_id'] and not d['dupe_title_artist']
            assert obj['classification']=='Paintings' or (n==764087 and obj['department']=='The American Wing' and obj['medium']=='Oil on canvas')
            im={}; pics={}
            for kind,key in [('original','primaryImage'),('display','primaryImageSmall')]:
             url=obj.get(key,'')
             assert url.startswith('https://images.metmuseum.org/'),key
             b=get(url).content
             pic=Image.open(io.BytesIO(b));pic.load()
             assert pic.format=='JPEG'
             im[kind]=pic.convert('RGB')
             pics[kind]={'url':url,'sha256':hashlib.sha256(b).hexdigest(),'byte_length':len(b),'width':pic.width,'height':pic.height}
            rms=math.sqrt(sum(v*v for v in ImageStat.Stat(ImageChops.difference(im['original'].resize(im['display'].size,Image.Resampling.LANCZOS),im['display'])).rms)/3)
            d['images']=pics;d['downscale_rms']=round(rms,5)
            d['duplicate_image_sha']=[v['id'] for v in old if v['image']['sha256']==pics['display']['sha256']]
            assert rms<30 and not d['duplicate_image_sha']
            print('CANDIDATE_PASS',json.dumps(d,ensure_ascii=False),flush=True)
            thumb=im['display'].copy();thumb.thumbnail((275,275))
            buf=io.BytesIO();thumb.save(buf,format='JPEG',quality=54)
            print('THUMB',n,base64.b64encode(buf.getvalue()).decode(),flush=True)
           except Exception as ex: print('CANDIDATE_HOLD',n,repr(ex),flush=True)
          PY