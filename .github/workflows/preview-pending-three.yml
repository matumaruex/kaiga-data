name: Inspect 3 pending Met source images
on:
  push:
    branches:
      - codex/museum-image-retry-3-20261109
    paths:
      - .github/workflows/preview-pending-three.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview-images:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout selected catalog
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install JPEG decoder
        run: python -m pip install "Pillow>=11,<13"
      - name: Verify registered bytes and emit small visual previews
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, urllib.request
          from PIL import Image
          db=json.load(open('data/artworks.json',encoding='utf-8'))['artworks']
          by_id={a['id']:a for a in db}
          for ident in ('met-45656','met-437985','met-436078'):
              a=by_id[ident]
              img=a['image']
              src=img.get('high_resolution') or img
              url=src.get('url') or src['display_url']
              print('INSPECT_START '+ident,flush=True)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=45) as response: raw=response.read()
                  h=hashlib.sha256(raw).hexdigest()
                  print('INSPECT_SOURCE '+ident+' bytes='+str(len(raw))+' sha256='+h+' registered_match='+str(h==src['sha256']),flush=True)
                  frame=Image.open(io.BytesIO(raw)).convert('RGB')
                  print('INSPECT_SIZE '+ident+' '+str(frame.size),flush=True)
                  frame.thumbnail((650,650))
                  out=io.BytesIO();frame.save(out,format='JPEG',quality=65,optimize=True)
                  encoded=base64.b64encode(out.getvalue()).decode('ascii')
                  print('INSPECT_JPEG_BEGIN '+ident,flush=True)
                  for i in range(0,len(encoded),800): print(encoded[i:i+800],flush=True)
                  print('INSPECT_JPEG_END '+ident,flush=True)
              except Exception as exc:
                  print('INSPECT_FAILED '+ident+' '+repr(exc),flush=True)
              print('INSPECT_END '+ident,flush=True)
          PY
      - name: Preview and save three evidence-checked artworks
        shell: bash
        run: |
          set -euo pipefail
          for id in met-45656 met-437985 met-436078; do
            echo "Registering $id"
            python3 scripts/complete_artwork.py preview --audit "docs/artwork-completion-audits/${id}-2026-11-09.json"
            python3 scripts/complete_artwork.py save --audit "docs/artwork-completion-audits/${id}-2026-11-09.json"
            python3 scripts/complete_artwork.py check
          done
          python3 scripts/validate_artworks.py
          python3 scripts/check_catalog_snapshot.py
      - name: Update current README count and commit successfully validated catalog
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          s=p.read_text(encoding='utf-8')
          old='**正式DBの鑑賞本文：290件／300作品。v2完成：290件'
          new='**正式DBの鑑賞本文：293件／300作品。v2完成：293件'
          assert s.count(old)==1, 'README current count must be 290 before revision'
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/artworks.json README.md
          git commit -m "Complete Met 45656, 437985 and 436078 with audited originals"
          git push
