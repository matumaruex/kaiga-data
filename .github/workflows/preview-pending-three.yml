name: Inspect 3 pending Met source images
on:
  push:
    branches:
      - codex/museum-image-retry-3-20261109
    paths:
      - .github/workflows/preview-pending-three.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview-images:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout selected catalog
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install JPEG decoder
        run: python -m pip install "Pillow>=11,<13"
      - name: Verify registered bytes and emit small visual previews
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, urllib.request
          from PIL import Image
          db=json.load(open('data/artworks.json',encoding='utf-8'))['artworks']
          by_id={a['id']:a for a in db}
          for ident in ('met-45656','met-437985','met-436078'):
              a=by_id[ident]
              img=a['image']
              src=img.get('high_resolution') or img
              url=src.get('url') or src['display_url']
              print('INSPECT_START '+ident,flush=True)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=45) as response: raw=response.read()
                  h=hashlib.sha256(raw).hexdigest()
                  print('INSPECT_SOURCE '+ident+' bytes='+str(len(raw))+' sha256='+h+' registered_match='+str(h==src['sha256']),flush=True)
                  frame=Image.open(io.BytesIO(raw)).convert('RGB')
                  print('INSPECT_SIZE '+ident+' '+str(frame.size),flush=True)
                  frame.thumbnail((650,650))
                  out=io.BytesIO();frame.save(out,format='JPEG',quality=65,optimize=True)
                  encoded=base64.b64encode(out.getvalue()).decode('ascii')
                  print('INSPECT_JPEG_BEGIN '+ident,flush=True)
                  for i in range(0,len(encoded),800): print(encoded[i:i+800],flush=True)
                  print('INSPECT_JPEG_END '+ident,flush=True)
              except Exception as exc:
                  print('INSPECT_FAILED '+ident+' '+repr(exc),flush=True)
              print('INSPECT_END '+ident,flush=True)
          PY
