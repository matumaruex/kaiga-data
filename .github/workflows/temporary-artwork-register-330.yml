name: Temporary audited artwork registration 330-332
on:
  push:
    branches:
      - codex/expand-artworks-330-332-20261111
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet pillow requests
      - name: Register individually with version-bound source audits and full suite
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('scripts/_tmp_register_330_332.py')
          s=path.read_text(encoding='utf-8')
          old="call('python','scripts/'+script,'check' if script in ('complete_artwork.py','add_artwork.py') else '')"
          assert old in s
          s=s.replace(old,"call('python','scripts/'+script,*(['check'] if script in ('complete_artwork.py','add_artwork.py') else []))")
          s=s.replace('\\`','`')
          old2="call('python','scripts/rotate_resume.py','update','--from',str(state))"
          assert old2 in s
          new2="state.write_text('## 現在の状態'+newstate.split('## 現在の状態',1)[1].split('## 過去の作業履歴',1)[0].strip()+'\\n',encoding='utf-8')\\n call('python','scripts/rotate_resume.py','update','--from',str(state))"
          s=s.replace(old2,new2.replace('\\n call','\n call'))
          old3="  binary=get(url).content\\n  im=Image.open(io.BytesIO(binary));im.load()"
          assert old3.replace('\\n','\n') in s
          new3="  binary=get(url).content\\n  for attempt in range(4):\\n   if len(binary)==length and hashlib.sha256(binary).hexdigest()==sha: break\\n   print('JPEG retry',kind,'got',len(binary),hashlib.sha256(binary).hexdigest(),flush=True)\\n   time.sleep(2+attempt)\\n   binary=get(url).content\\n  im=Image.open(io.BytesIO(binary));im.load()"
          s=s.replace(old3.replace('\\n','\n'),new3.replace('\\n','\n'))
          path.write_text(s,encoding='utf-8')
          PY
          python scripts/_tmp_register_330_332.py
