name: Audit AIC live JPEG hashes
on:
  push:
    paths:
      - scripts/audit_aic_live_images.py
      - .github/workflows/audit-aic-live.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  image-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify all 51 AIC JPEG sources
        run: python3 scripts/audit_aic_live_images.py
      - name: Upload immutable run evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aic-image-live-audit
          path: docs/aic-image-live-audit.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit non-destructive status report
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/aic-image-live-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "AIC 51画像の現行配信とハッシュ状態を記録"
            git pull --rebase
            git push
          fi
