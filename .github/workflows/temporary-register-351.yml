name: Temporary audited Met registration 351-353
on:
  push:
    branches: [codex/expand-artworks-351-353-20261111]
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet requests pillow
      - name: Three reviewed artwork registrations and full regression suite
        run: |
          python -m py_compile scripts/_temporary_register_351_353.py
          python scripts/_temporary_register_351_353.py
