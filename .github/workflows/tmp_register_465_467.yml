name: One-off Met artworks 465-467 registration
on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp_register_465_467.yml
      - scripts/tmp_register_465_467.py
      - scripts/tmp_specs_465_467.json
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the prepared research branch
        uses: actions/checkout@v4
        with:
          ref: codex/artworks-465-467-20261113
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original/display JPEG inspection dependencies
        run: python -m pip install pillow requests
      - name: Verify JPEG variants, register three artworks and run all catalog tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python scripts/tmp_register_465_467.py
