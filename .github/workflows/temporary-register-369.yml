name: Temporary audited Met registration 369-371
on:
  push:
    branches: [codex/expand-artworks-369-371-20261111]
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet requests pillow
      - name: Register three vetted artworks and run all data checks and regression tests
        run: |
          python -m py_compile scripts/_temporary_register_369_371.py
          python scripts/_temporary_register_369_371.py
