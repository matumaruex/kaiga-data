name: Temporary Met image verification 314-316
on:
  push:
    branches: [codex/expand-artworks-314-316-v2]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify original official images and metadata
        shell: bash
        run: |
          python3 -m pip -q install pillow
          python3 - <<'PY'
          import hashlib, io, json, time, urllib.request
          from PIL import Image, ImageChops, ImageStat
          def get(url):
              last=None
              for n in range(4):
                  try:
                      req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 museum-artwork-research/1.0"})
                      with urllib.request.urlopen(req,timeout=70) as r: return r.read()
                  except Exception as exc:
                      last=exc
                      time.sleep(n+1)
              raise last
          for oid in (453283,860959,853239):
              try:
                  obj=json.loads(get("https://collectionapi.metmuseum.org/public/collection/v1/objects/"+str(oid)))
                  keys=("objectID","title","artistDisplayName","objectDate","classification","medium","isPublicDomain","accessionNumber","culture","primaryImage","primaryImageSmall")
                  print("OBJECT",oid,json.dumps({k:obj.get(k) for k in keys},ensure_ascii=False),flush=True)
                  ims={}
                  for k in ("primaryImageSmall","primaryImage"):
                      url=obj.get(k)
                      if not url: raise ValueError("No official "+k+" URL")
                      b=get(url)
                      im=Image.open(io.BytesIO(b))
                      im.load()
                      ims[k]=im.convert("RGB")
                      print("IMAGE",oid,k,json.dumps({"url":url,"sha256":hashlib.sha256(b).hexdigest(),"byte_length":len(b),"width":im.width,"height":im.height,"format":im.format}),flush=True)
                  display=ims["primaryImageSmall"]
                  orig=ims["primaryImage"].resize(display.size,Image.Resampling.LANCZOS)
                  diff=ImageChops.difference(display,orig)
                  stat=ImageStat.Stat(diff)
                  rms=(sum(x*x for x in stat.rms)/3)**0.5
                  print("MATCH",oid,"resized_original_to_display_rgb_rms",round(rms,4),flush=True)
              except Exception as exc:
                  print("ERROR",oid,repr(exc),flush=True)
          PY
