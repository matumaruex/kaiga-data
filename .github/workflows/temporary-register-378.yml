    branches: [codex/expand-artworks-378-380-20261111]
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet requests pillow
      - name: Register 378–380 with source-bound and full JPEG audit then run 50 unit tests
        run: |
          python -m py_compile scripts/_temporary_register_378_380.py
          python scripts/_temporary_register_378_380.py
