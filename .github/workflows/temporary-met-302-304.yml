name: Temporary Met artwork image verification 302-304
on:
  push:
    branches:
      - codex/expand-artworks-302-304-v2
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Met API and image bytes
        shell: bash
        run: |
          python3 -m pip -q install pillow
          python3 - <<'PY'
          import urllib.request, json, hashlib, io, time, math
          from PIL import Image, ImageChops, ImageStat
          ua={"User-Agent":"Mozilla/5.0 museum-artwork-verification/1.0"}
          def get(url):
            last=None
            for i in range(3):
              try:
                req=urllib.request.Request(url,headers=ua)
                with urllib.request.urlopen(req,timeout=75) as f: return f.read()
              except Exception as e:
                last=e
                time.sleep(2+i)
            raise last
          for oid in (871866,827660,436875):
            try:
              api="https://collectionapi.metmuseum.org/public/collection/v1/objects/"+str(oid)
              obj=json.loads(get(api))
              print("OBJECT",oid,json.dumps({k:obj.get(k) for k in ("objectID","title","artistDisplayName","objectDate","objectName","classification","medium","isPublicDomain","accessionNumber","culture","primaryImage","primaryImageSmall")},ensure_ascii=False),flush=True)
              imgs={}
              for k in ("primaryImageSmall","primaryImage"):
                url=obj.get(k)
                if not url: raise ValueError("Missing "+k)
                raw=get(url)
                im=Image.open(io.BytesIO(raw))
                imgs[k]=im.convert("RGB")
                print("IMAGE",oid,k,json.dumps({"url":url,"sha256":hashlib.sha256(raw).hexdigest(),"byte_length":len(raw),"width":im.width,"height":im.height,"format":im.format}),flush=True)
              display=imgs["primaryImageSmall"]; original=imgs["primaryImage"]
              orig_small=original.resize(display.size,Image.Resampling.LANCZOS)
              from PIL import ImageChops
              diff=ImageChops.difference(display,orig_small)
              stat=ImageStat.Stat(diff)
              rms=(sum(v*v for v in stat.rms)/3)**.5
              print("MATCH",oid,"display_original_resized_rms",round(rms,3),flush=True)
            except Exception as e:
              print("ERROR",oid,str(e),flush=True)
          PY
