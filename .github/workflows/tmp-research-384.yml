name: Temporary research for 384-386
on:
  push:
    paths:
      - ".github/workflows/tmp-research-384.yml"
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check candidate IDs against actual 383-work database
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('data/artworks.json').read_text())['artworks']
          byid={v['id']:v for v in a}
          candidates=[40429,825596,764089,825597,456967,44760,910556,764091,40431,57239,764095,309529,456968,40635,910555,825594,40430,40428,451022,764088,764090]
          for number in candidates:
            ident='met-'+str(number)
            art=byid.get(ident)
            print(ident, 'REGISTERED: '+art['facts']['title_original'] if art else 'NOT IN DB',flush=True)
          PY
      - run: pip install pillow
      - name: Collect actual Met API records and exact original/display JPEG evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import json,hashlib,urllib.request,urllib.error,io,math,datetime,time,base64
          from PIL import Image,ImageChops,ImageStat
          ids=[40429,825596,764089]
          out={'research_date':'2026-11-12','works':[]}
          def fetch(url):
            for i in range(4):
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'MuseumCatalogResearch/1.0 museum dataset validation','Accept':'*/*'})
                with urllib.request.urlopen(req,timeout=45) as r:
                  return r.read()
              except Exception as e:
                if i==3: raise
                time.sleep(2+i*2)
          for ident in ids:
            record={'id':ident}
            try:
              api=json.loads(fetch(f'https://collectionapi.metmuseum.org/public/collection/v1/objects/{ident}'))
              keys=['objectID','title','artistDisplayName','artistDisplayBio','objectDate','culture','country','medium','classification','isPublicDomain','primaryImage','primaryImageSmall','accessionNumber','objectURL','department']
              record['api']={k:api.get(k) for k in keys}
              imgs={}
              for typ,url in [('display',api.get('primaryImageSmall')),('original',api.get('primaryImage'))]:
                if not url:
                  record['error']=f'missing {typ}';break
                raw=fetch(url)
                pic=Image.open(io.BytesIO(raw)).convert('RGB')
                imgs[typ]={'url':url,'sha256':hashlib.sha256(raw).hexdigest(),'byte_length':len(raw),'width':pic.width,'height':pic.height}
                if typ=='display':
                  small=pic
                  thumbnail=pic.copy();thumbnail.thumbnail((320,320));buffer=io.BytesIO();thumbnail.save(buffer,format='JPEG',quality=75)
                  record['thumbnail_base64']=base64.b64encode(buffer.getvalue()).decode('ascii')
                else: orig=pic
              if len(imgs)==2:
                z=orig.resize(small.size,Image.Resampling.LANCZOS)
                diff=ImageChops.difference(z,small)
                sq=ImageStat.Stat(diff).rms
                imgs['rgb_resize_rms']=math.sqrt(sum(v*v for v in sq)/3)
              record['images']=imgs
              record['api_raw_sha256']=hashlib.sha256(json.dumps(api,sort_keys=True).encode()).hexdigest()
            except Exception as e:
              record['error']=repr(e)
            out['works'].append(record)
          from pathlib import Path
          p=Path('docs/artwork-research-evidence/met-384-386-2026-11-12.json')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps(out,ensure_ascii=False))
          PY
      - name: Save verified facts and image fingerprints to branch
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add docs/artwork-research-evidence/met-384-386-2026-11-12.json
          git commit -m "research: record live Met candidate facts and exact JPEG hashes"
          git push
