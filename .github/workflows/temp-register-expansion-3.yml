name: Temporary register Met expansion 311–313
on:
  push:
    branches: [codex/museum-expansion-311-313-20261110]
    paths: [.github/workflows/temp-register-expansion-3.yml]
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow
      - name: Check official source JPEGs and register reviewed artworks one by one
        run: python scripts/temp_register_expansion_3.py
