name: One-off verified v2 Met 21126 registration
on:
  workflow_dispatch:
  push:
    branches: [codex/add-met-21126-v2]
    paths: [.github/workflows/save-met21126-once.yml]
permissions:
  contents: write
jobs:
  register-one:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install "Pillow>=11,<13"
      - name: Derive one proposal, original Japanese explanation and source-bound audit
        run: python scripts/research_met_21126_once.py
      - name: Validate exact proposed addition without writing the DB
        run: python scripts/add_artwork.py preview --audit docs/artwork-completion-audits/met-21126-2026-11-10.json
      - name: Save exactly one completed new painting
        run: python scripts/add_artwork.py save --audit docs/artwork-completion-audits/met-21126-2026-11-10.json
      - name: Confirm no unrelated work is changed and all completion records validate
        run: |
          python scripts/add_artwork.py check
          python scripts/complete_artwork.py check
          python scripts/visitor_draft_queue.py check
          python scripts/validate_artworks.py
          python scripts/check_image_sources.py
          python scripts/check_catalog_snapshot.py
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Save one finished record on the trial branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/artworks.json data/image-sources.json README.md
          git add drafts/artwork-additions/met-21126.json drafts/visitor-explanations/met-21126.json
          git add docs/artwork-completion-audits/met-21126-2026-11-10.json
          git commit -m "Met21126 若い夫、初めての買い物をv2完成登録"
          git push origin HEAD:codex/add-met-21126-v2
