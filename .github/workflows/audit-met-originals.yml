name: Audit Met high-resolution originals
on:
  push:
    paths:
      - "scripts/audit_met_originals.py"
      - ".github/workflows/audit-met-originals.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-met-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out artwork data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Pillow for JPEG header dimension checks
        run: python -m pip install "Pillow>=11,<13"
      - name: Probe 249 official original images
        run: python scripts/audit_met_originals.py
      - name: Retain machine-readable audit as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: met-original-image-quality-audit
          path: |
            docs/met-original-image-audit.json
            docs/met-original-image-audit.md
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit read-only audit report to GitHub
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/met-original-image-audit.json docs/met-original-image-audit.md
          if ! git diff --cached --quiet; then
            git commit -m "Met高解像度版249件の画像寸法・公式API照合結果"
            git pull --rebase
            git push
          fi
