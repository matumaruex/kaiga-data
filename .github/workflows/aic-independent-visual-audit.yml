name: Compare AIC 51 registered images with official IIIF images
on:
  push:
    paths:
      - "scripts/audit_aic_independent_visual.py"
      - ".github/workflows/aic-independent-visual-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out artwork registry
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install "Pillow>=11,<13"
      - name: Download source and official museum images, compare them without editing artwork data
        run: python scripts/audit_aic_independent_visual.py
      - name: Save comparison report and visual contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aic51-independent-visual-evidence
          path: artifacts/aic-independent-visual/
          if-no-files-found: warn
          retention-days: 14
