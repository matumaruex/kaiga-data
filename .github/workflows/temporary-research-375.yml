name: Temporary exact museum research 375-377
on:
  push:
    branches: [codex/expand-artworks-375-377-20261111]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet requests pillow
      - name: Match public-domain Met objects, catalog duplicates, primary JPEGs and preview
        run: |
          python - <<'PY'
          import json,requests,io,hashlib,math,time,base64
          from PIL import Image,ImageChops,ImageStat
          ids=[853449,764092,441379,813585]
          old=json.load(open('data/artworks.json'))['artworks']
          assert len(old)==374
          def get(url):
           for attempt in range(5):
            try:
             r=requests.get(url,timeout=74,headers={'User-Agent':'OpenAccessMuseumCatalogQuality/1.0'})
             if r.status_code==200:return r
             print('HTTP',r.status_code,url,flush=True)
            except Exception as ex: print('FETCH_ERR',str(ex)[:120],flush=True)
            time.sleep(2+attempt*2)
           raise RuntimeError('failed: '+url)
          for n in ids:
           try:
            o=get(f'https://collectionapi.metmuseum.org/public/collection/v1/objects/{n}').json()
            d={'id':f'met-{n}','title':o.get('title'),'artist':o.get('artistDisplayName'),
              'date':o.get('objectDate'),'culture':o.get('culture'),'medium':o.get('medium'),
              'classification':o.get('classification'),'department':o.get('department'),
              'accession':o.get('accessionNumber'),'publicDomain':o.get('isPublicDomain'),
              'id_duplicate':[x['id'] for x in old if x['id']==f'met-{n}'],
              'title_artist_duplicate':[x['id'] for x in old if x['facts']['title_original']==o.get('title') and x['facts']['artist']==o.get('artistDisplayName')]}
            print('CANDIDATE_META',json.dumps(d,ensure_ascii=False),flush=True)
            assert o['objectID']==n and o['isPublicDomain'] is True and not d['id_duplicate'] and not d['title_artist_duplicate']
            assert o['classification']=='Paintings' or (o['department']=='The American Wing' and 'Oil' in o['medium'])
            pics={};ims={}
            for kind,key in [('original','primaryImage'),('display','primaryImageSmall')]:
             url=o.get(key,'')
             assert url.startswith('https://images.metmuseum.org/')
             b=get(url).content
             im=Image.open(io.BytesIO(b));im.load()
             assert im.format=='JPEG'
             ims[kind]=im.convert('RGB')
             pics[kind]={'url':url,'sha256':hashlib.sha256(b).hexdigest(),'byte_length':len(b),'width':im.width,'height':im.height}
            rms=math.sqrt(sum(z*z for z in ImageStat.Stat(ImageChops.difference(ims['original'].resize(ims['display'].size,Image.Resampling.LANCZOS),ims['display'])).rms)/3)
            d['images']=pics;d['rms']=round(rms,5)
            d['image_sha_duplicate']=[x['id'] for x in old if x['image']['sha256']==pics['display']['sha256']]
            assert rms<30 and not d['image_sha_duplicate']
            print('CANDIDATE_PASS',json.dumps(d,ensure_ascii=False),flush=True)
            thumb=ims['display'].copy();thumb.thumbnail((270,270))
            bio=io.BytesIO();thumb.save(bio,format='JPEG',quality=52,optimize=True)
            print('THUMB',n,base64.b64encode(bio.getvalue()).decode(),flush=True)
           except Exception as ex:print('CANDIDATE_HOLD',n,repr(ex),flush=True)
          PY