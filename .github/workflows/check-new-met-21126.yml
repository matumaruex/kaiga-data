name: One-off Met 21126 official image and template verification
on:
  workflow_dispatch:
  push:
    branches: [codex/add-met-21126-v2]
    paths: [.github/workflows/check-new-met-21126.yml]
permissions:
  contents: read
jobs:
  verify-one:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install "Pillow>=11,<13"
      - name: Fetch official Met metadata and exact JPEG, inspect one existing record structure
        run: |
          python - <<'PY'
          import json, hashlib, urllib.request, io
          from PIL import Image
          head={"User-Agent":"KaigaMuseumResearch/0.1 (source verification)","Accept":"application/json,image/jpeg,*/*"}
          obj_url="https://collectionapi.metmuseum.org/public/collection/v1/objects/21126"
          with urllib.request.urlopen(urllib.request.Request(obj_url,headers=head),timeout=35) as r:
              obj=json.load(r)
          print("OFFICIAL_METADATA="+json.dumps({k:obj.get(k) for k in (
              "objectID","isPublicDomain","title","artistDisplayName","artistBeginDate","artistEndDate","objectDate",
              "medium","classification","department","dimensions","culture","creditLine","accessionNumber",
              "primaryImage","primaryImageSmall","objectURL")},ensure_ascii=False))
          url=obj.get("primaryImageSmall") or obj.get("primaryImage")
          assert obj.get("isPublicDomain") is True and url.startswith("https://images.metmuseum.org/")
          with urllib.request.urlopen(urllib.request.Request(url,headers=head),timeout=60) as r:
              image_bytes=r.read(14000000)
              status=r.status
              mime=r.headers.get("Content-Type")
          assert status==200 and image_bytes[:3]==b"\xff\xd8\xff" and len(image_bytes)<14000000
          im=Image.open(io.BytesIO(image_bytes))
          im.verify()
          im=Image.open(io.BytesIO(image_bytes))
          print("OFFICIAL_IMAGE="+json.dumps({"url":url,"status":status,"mime":mime,"sha256":hashlib.sha256(image_bytes).hexdigest(),"byte_length":len(image_bytes),"width":im.width,"height":im.height}))
          im.thumbnail((840,840))
          import os
          os.makedirs("artifacts/met-21126",exist_ok=True)
          im.save("artifacts/met-21126/verified-source-thumbnail.jpg",quality=84)
          with open("artifacts/met-21126/source-report.json","w") as f:json.dump(obj,f,ensure_ascii=False,indent=2)
          with open("data/artworks.json") as f: works=json.load(f)["artworks"]
          with open("data/image-sources.json") as f: recs=json.load(f)["records"]
          template=next(a for a in works if a["id"]=="met-11122")
          print("TEMPLATE_ARTWORK="+json.dumps(template,ensure_ascii=False))
          print("TEMPLATE_IMAGE="+json.dumps(next(a for a in recs if a["id"]=="met-11122"),ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: met21126-official-visual-report
          path: artifacts/met-21126/*
          retention-days: 14
          if-no-files-found: warn
