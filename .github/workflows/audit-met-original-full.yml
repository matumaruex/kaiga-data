name: Verify and register original-resolution Met images
on:
  push:
    paths:
      - "scripts/audit_met_original_full.py"
      - ".github/workflows/audit-met-original-full.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-original-jpegs:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout catalog
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Image decoder
        run: python -m pip install "Pillow>=11,<13"
      - name: Verify complete JPEGs and register only fully checked originals
        run: python scripts/audit_met_original_full.py --promote
      - name: Validate catalog integrity
        run: |
          python scripts/validate_artworks.py
          python scripts/check_image_sources.py
      - name: Keep all download and comparison results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: met-complete-highres-jpeg-verification
          path: |
            docs/met-original-full-jpeg-audit.json
            docs/met-original-full-jpeg-audit.md
          if-no-files-found: ignore
          retention-days: 14
      - name: Save verified metadata
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/artworks.json data/image-sources.json docs/met-original-full-jpeg-audit.json docs/met-original-full-jpeg-audit.md
          if ! git diff --cached --quiet; then
            git commit -m "Met画像を全量照合し高解像度版を展示用に登録"
            git pull --rebase
            git push
          fi
