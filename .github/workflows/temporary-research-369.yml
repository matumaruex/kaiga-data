name: Temporary Met survey 369-371
on:
  push:
    branches: [codex/expand-artworks-369-371-20261111]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet requests pillow
      - name: Verify PD, image rights, duplicates, JPEG SHA and visual previews
        run: |
          python - <<'PY'
          import json,requests,io,hashlib,math,time,base64
          from PIL import Image,ImageChops,ImageStat
          ids=[53551,747199,437405,45229]
          old=json.load(open('data/artworks.json'))['artworks']
          assert len(old)==368
          def get(url):
           for n in range(5):
            try:
             r=requests.get(url,timeout=70,headers={'User-Agent':'OpenAccessArtCatalogResearch/1.0'})
             if r.status_code==200:return r
             print('HTTP',r.status_code,url,flush=True)
            except Exception as e:print('GETERR',str(e)[:100],flush=True)
            time.sleep(n*2+2)
           raise ValueError('could not fetch '+url)
          for n in ids:
           try:
            o=get(f'https://collectionapi.metmuseum.org/public/collection/v1/objects/{n}').json()
            d={'id':f'met-{n}','title':o.get('title'),'artist':o.get('artistDisplayName'),'date':o.get('objectDate'),
               'medium':o.get('medium'),'culture':o.get('culture'),'classification':o.get('classification'),
               'department':o.get('department'),'accession':o.get('accessionNumber'),'pd':o.get('isPublicDomain'),
               'duplicate_id':[x['id'] for x in old if x['id']==f'met-{n}'],
               'duplicate_title_artist':[x['id'] for x in old if x['facts']['title_original']==o.get('title') and x['facts']['artist']==o.get('artistDisplayName')]}
            print('CANDIDATE_META',json.dumps(d,ensure_ascii=False),flush=True)
            assert o['objectID']==n and o['isPublicDomain'] is True
            assert not d['duplicate_id'] and not d['duplicate_title_artist']
            assert o['classification']=='Paintings' or (n==747199 and o['department']=='The American Wing' and 'Oil and gold on copper' in o['medium'])
            pics={};ims={}
            for kind,key in [('original','primaryImage'),('display','primaryImageSmall')]:
             url=o.get(key,'')
             assert url.startswith('https://images.metmuseum.org/')
             raw=get(url).content
             im=Image.open(io.BytesIO(raw));im.load()
             assert im.format=='JPEG'
             ims[kind]=im.convert('RGB')
             pics[kind]={'url':url,'sha256':hashlib.sha256(raw).hexdigest(),'byte_length':len(raw),'width':im.width,'height':im.height}
            rms=math.sqrt(sum(v*v for v in ImageStat.Stat(ImageChops.difference(ims['original'].resize(ims['display'].size,Image.Resampling.LANCZOS),ims['display'])).rms)/3)
            d['images']=pics;d['rms']=round(rms,5)
            d['image_sha_duplicates']=[x['id'] for x in old if x['image']['sha256']==pics['display']['sha256']]
            assert rms<30 and not d['image_sha_duplicates']
            print('CANDIDATE_PASS',json.dumps(d,ensure_ascii=False),flush=True)
            im=ims['display'].copy();im.thumbnail((275,275))
            out=io.BytesIO();im.save(out,format='JPEG',quality=55)
            print('THUMB',n,base64.b64encode(out.getvalue()).decode(),flush=True)
           except Exception as e:print('CANDIDATE_HOLD',n,repr(e),flush=True)
          PY