name: Temporary artwork image research 330-332
on:
  push:
    branches:
      - codex/expand-artworks-330-332-20261111
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet pillow requests
      - name: Source API and complete image byte research
        shell: bash
        run: |
          python - <<'PY'
          import io, json, hashlib, math, time
          import requests
          from PIL import Image,ImageChops,ImageStat
          ids=[37817,437102,451256]
          catalog=json.load(open('data/artworks.json'))['artworks']
          registry=json.load(open('data/image-sources.json'))['records']
          existing_ids={x['id'] for x in catalog}
          assert len(catalog)==329,len(catalog)
          def get(url):
              for i in range(4):
                  try:
                      r=requests.get(url,headers={'User-Agent':'MuseumArtworkResearch/1.0 (Open Access metadata)'},timeout=75)
                      if r.status_code==200: return r
                      print('HTTP',r.status_code,url,'retry',i,flush=True)
                  except Exception as exc:
                      print('GET ERROR',str(exc)[:100],url,'retry',i,flush=True)
                  time.sleep(2+i*3)
              raise RuntimeError('cannot retrieve '+url)
          results=[]
          for num in ids:
              info=get(f'https://collectionapi.metmuseum.org/public/collection/v1/objects/{num}').json()
              ident='met-'+str(num)
              assert info['objectID']==num
              dup_title=[x['id'] for x in catalog if x['facts']['title_original']==info['title'] and x['facts']['artist']==(info.get('artistDisplayName') or '')]
              assert ident not in existing_ids and not any(x['id']==ident for x in registry),ident
              assert not dup_title,(ident,dup_title)
              assert info['isPublicDomain'] is True,(ident,'non public domain')
              assert info['classification']=='Paintings',(ident,info['classification'])
              p=info.get('primaryImage','');s=info.get('primaryImageSmall','')
              assert p.startswith('https://images.metmuseum.org/') and s.startswith('https://images.metmuseum.org/'),(ident,p,s)
              imgs={}
              for kind,url in (('original',p),('display',s)):
                  b=get(url).content
                  img=Image.open(io.BytesIO(b));img.load()
                  assert img.format in ('JPEG','MPO'),(ident,kind,img.format)
                  imgs[kind]={'url':url,'sha256':hashlib.sha256(b).hexdigest(),'byte_length':len(b),'width':img.width,'height':img.height,'mode':img.mode}
              a=Image.open(io.BytesIO(get(p).content)).convert('RGB')
              b=Image.open(io.BytesIO(get(s).content)).convert('RGB')
              resize=a.resize(b.size,Image.Resampling.LANCZOS)
              stat=ImageStat.Stat(ImageChops.difference(resize,b))
              rms=math.sqrt(sum(x*x for x in stat.rms)/3)
              assert rms<30,(ident,rms)
              out={'id':ident,'objectID':num,'title':info['title'],'artistDisplayName':info.get('artistDisplayName'),'objectDate':info.get('objectDate'),'classification':info.get('classification'),'medium':info.get('medium'),'culture':info.get('culture'),'country':info.get('country'),'geographyType':info.get('geographyType'),'accessionNumber':info.get('accessionNumber'),'department':info.get('department'),'artistDisplayBio':info.get('artistDisplayBio'),'isPublicDomain':info['isPublicDomain'],'source':info.get('objectURL'),'image':imgs,'downscale_rgb_rms':round(rms,5),'already_registered_id':ident in existing_ids,'already_registered_same_title_artist':dup_title,'registered_image_sha_duplicate':[x['id'] for x in catalog if x.get('image',{}).get('sha256')==imgs['display']['sha256']]}
              assert not out['registered_image_sha_duplicate'],out
              results.append(out)
              print('RESEARCH-JSON='+json.dumps(out,ensure_ascii=False),flush=True)
          print('RESEARCH-PASS 3 source objects; all original and display official Met JPEGs; identities and catalog duplicates checked',flush=True)
          PY
