name: Diagnose 300 image checksum differences
on:
  push:
    paths:
      - "scripts/diagnose_catalog300_images.py"
      - ".github/workflows/diagnose-catalog300-images.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-three:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python3 scripts/diagnose_catalog300_images.py
      - uses: actions/upload-artifact@v4
        with:
          name: catalog300-image-diagnostics
          path: artifacts/diagnostic-300-images.json
          if-no-files-found: error
