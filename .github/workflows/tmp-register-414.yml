name: Temporary verified register 414-416
on:
  push:
    paths:
      - ".github/workflows/tmp-register-414.yml"
      - "scripts/tmp_register_414.py"
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preview, register one by one, run exact audit and all regressions
        run: python3 scripts/tmp_register_414.py
      - name: Commit only reviewed permanent files
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add README.md data/artworks.json data/image-sources.json drafts/artwork-additions drafts/visitor-explanations docs/artwork-completion-audits docs/resume-artwork-work.md docs/history/resume-updates.md
          git commit -m "data: register three Met artworks 414-416 with real source and image audits"
          git push
