name: Temporary audited registration 339-341
on:
  push:
    branches: [codex/expand-artworks-339-341-20261111]
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet requests pillow
      - name: Source and image audit with three sequential registrations and regression checks
        run: |
          python -m py_compile scripts/_temporary_register_339_341.py
          python scripts/_temporary_register_339_341.py
