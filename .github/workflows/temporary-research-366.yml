name: Temporary Met research 366-368
on:
  push:
    branches: [codex/expand-artworks-366-368-20261111]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet requests pillow
      - name: Verify exact Met records, no duplicates, full JPEGs and visual previews
        run: |
          python - <<'PY'
          import json,requests,io,hashlib,math,time,base64
          from PIL import Image,ImageChops,ImageStat
          ids=[57166,13171,74730,74725,37974]
          old=json.load(open('data/artworks.json'))['artworks']
          assert len(old)==365
          def get(url):
           for n in range(5):
            try:
             r=requests.get(url,timeout=65,headers={'User-Agent':'PublicMetArtVerifier/1.0'})
             if r.status_code==200:return r
             print('HTTP',r.status_code,url,flush=True)
            except Exception as e:print('FETCH ERROR',str(e)[:120],flush=True)
            time.sleep(2+n*2)
           raise RuntimeError(url)
          for n in ids:
           try:
            o=get('https://collectionapi.metmuseum.org/public/collection/v1/objects/'+str(n)).json()
            d={'id':'met-'+str(n),'title':o.get('title'),'artist':o.get('artistDisplayName'),
               'date':o.get('objectDate'),'culture':o.get('culture'),'medium':o.get('medium'),
               'classification':o.get('classification'),'department':o.get('department'),
               'accession':o.get('accessionNumber'),'publicDomain':o.get('isPublicDomain'),
               'id_duplicate':[x['id'] for x in old if x['id']==f'met-{n}'],
               'title_artist_duplicates':[x['id'] for x in old if x['facts']['title_original']==o.get('title') and x['facts']['artist']==o.get('artistDisplayName')]}
            print('CANDIDATE_META',json.dumps(d,ensure_ascii=False),flush=True)
            assert o['objectID']==n and o['isPublicDomain'] is True and not d['id_duplicate'] and not d['title_artist_duplicates']
            assert o['classification']=='Paintings' or (n==13171 and o['department']=='The American Wing' and o['medium'] in ('Oil on canvas','Oil on canvas.'))
            pics={};im={}
            for kind,key in [('original','primaryImage'),('display','primaryImageSmall')]:
             url=o.get(key,'')
             assert url.startswith('https://images.metmuseum.org/')
             raw=get(url).content
             p=Image.open(io.BytesIO(raw));p.load()
             assert p.format=='JPEG'
             im[kind]=p.convert('RGB')
             pics[kind]={'url':url,'sha256':hashlib.sha256(raw).hexdigest(),'byte_length':len(raw),'width':p.width,'height':p.height}
            rms=math.sqrt(sum(v*v for v in ImageStat.Stat(ImageChops.difference(im['original'].resize(im['display'].size,Image.Resampling.LANCZOS),im['display'])).rms)/3)
            d['images']=pics;d['rms']=round(rms,5)
            d['image_sha_duplicates']=[x['id'] for x in old if x['image']['sha256']==pics['display']['sha256']]
            assert rms<30 and not d['image_sha_duplicates']
            print('CANDIDATE_PASS',json.dumps(d,ensure_ascii=False),flush=True)
            th=im['display'].copy();th.thumbnail((260,260))
            buf=io.BytesIO();th.save(buf,format='JPEG',quality=53)
            print('THUMB',n,base64.b64encode(buf.getvalue()).decode(),flush=True)
           except Exception as e:print('CANDIDATE_HOLD',n,repr(e),flush=True)
          PY