name: One-off Met artworks 447-449 registration
on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp_register_447_449.yml
      - scripts/tmp_register_447_449.py
      - scripts/tmp_specs_447_449.json
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the prepared research branch
        uses: actions/checkout@v4
        with:
          ref: codex/artworks-447-449-20261113
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official image inspection dependencies
        run: python -m pip install pillow requests
      - name: Verify original/display JPEGs and sequentially register three new artworks
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python scripts/tmp_register_447_449.py
