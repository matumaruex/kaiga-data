name: Complete last 3 audited artworks 2026-11-10
on:
  push:
    branches:
      - codex/museum-image-retry-3-20261110
    paths:
      - .github/workflows/complete-pending-three-20261110.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Image decoder
        run: python -m pip install "Pillow>=11,<13"
      - name: Configure authorized commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Independently registered per-work checks, save, and branch commits
        run: python scripts/tmp_complete_three_20261110.py
