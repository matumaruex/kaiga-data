name: Temporary register 324-326
on:
  push:
    branches: [codex/expand-artworks-324-326-20261110]
    paths: ['.github/workflows/temp-register-324-326.yml']
permissions:
  contents: write
jobs:
  register-audited-three:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Individually audit, preview, save and validate three works
        run: python3 scripts/temp_register_324_326.py
      - name: Commit vetted data and precise restart note
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/artworks.json data/image-sources.json docs/artwork-completion-audits/met-764090-2026-11-10.json docs/artwork-completion-audits/met-77180-2026-11-10.json docs/artwork-completion-audits/met-701989-2026-11-10.json docs/resume-artwork-work.md docs/history/resume-updates.md
          git diff --cached --check
          git diff --cached --stat
          git commit -m "data: Register audited Met paintings 324-326"
          git push origin HEAD:codex/expand-artworks-324-326-20261110
