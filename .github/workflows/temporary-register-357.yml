name: Temporary audited Met registration 357-359
on:
  push:
    branches: [codex/expand-artworks-357-359-20261111]
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet requests pillow
      - name: Register three vetted artworks and run all tests
        run: |
          python -m py_compile scripts/_temporary_register_357_359.py
          python scripts/_temporary_register_357_359.py
