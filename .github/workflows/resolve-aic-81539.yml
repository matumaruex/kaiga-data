name: Resolve AIC Monet thumbnail re-encoding
on:
  push:
    paths:
      - scripts/resolve_aic_81539.py
      - .github/workflows/resolve-aic-81539.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install "Pillow>=11,<13"
      - run: python scripts/resolve_aic_81539.py
      - run: |
          python scripts/validate_artworks.py
          python scripts/check_image_sources.py
          python scripts/check_catalog_snapshot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monet-thumbnail-revalidation
          path: docs/aic-81539-thumbnail-recheck.json
          if-no-files-found: ignore
      - name: Commit after independent image comparison
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/artworks.json data/image-sources.json docs/aic-81539-thumbnail-recheck.json
          if ! git diff --cached --quiet; then
            git commit -m "モネの更新済みJPEGを原画像照合後に再登録"
            git pull --rebase
            git push
          fi
