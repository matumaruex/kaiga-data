name: Verify batch 020 Met source
on:
  push:
    paths:
      - "scripts/research_batch020.py"
      - "data/candidates-batch-020.json"
      - ".github/workflows/verify-batch020.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python3 scripts/research_batch020.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch020-evidence
          path: artifacts/batch020-evidence.json
