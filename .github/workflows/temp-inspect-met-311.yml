name: Temporary inspect candidate Met image files
on:
  push:
    branches: [codex/museum-expansion-311-313-20261110]
    paths: [.github/workflows/temp-inspect-met-311.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow
      - shell: bash
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,io,json,hashlib,math,base64
          from PIL import Image,ImageChops,ImageStat
          def dl(url):
            url=urllib.parse.quote(url,safe=':/%?=&,.-_~')
            r=urllib.request.Request(url,headers={'User-Agent':'MuseumResearch/1.0'})
            with urllib.request.urlopen(r,timeout=60) as f: return f.read(),f.status,f.url
          for oid in (45808,11269,452104,40447,72471):
            try:
              j=json.loads(dl(f'https://collectionapi.metmuseum.org/public/collection/v1/objects/{oid}')[0])
              d={k:j.get(k) for k in ('objectID','title','artistDisplayName','objectDate','objectName','classification','culture','accessionNumber','isPublicDomain','primaryImageSmall','primaryImage')}
              d['images']={};imgs={}
              for k,label in [('primaryImageSmall','display'),('primaryImage','original')]:
                if not j.get(k): continue
                raw,status,u=dl(j[k]);im=Image.open(io.BytesIO(raw));imgs[label]=im.convert('RGB')
                d['images'][label]={'url':u,'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw),'status':status,'width':im.width,'height':im.height,'format':im.format}
              if 'display' in imgs and 'original' in imgs:
                pic=imgs['original'].resize(imgs['display'].size,Image.Resampling.LANCZOS)
                rms=ImageStat.Stat(ImageChops.difference(pic,imgs['display'])).rms
                d['rms']=round(math.sqrt(sum(x*x for x in rms)/3),4)
              print('ART_INFO='+json.dumps(d,ensure_ascii=False,separators=(',',':')),flush=True)
              if 'original' in imgs:
                p=imgs['original'];p.thumbnail((640,640),Image.Resampling.LANCZOS);b=io.BytesIO();p.save(b,'JPEG',quality=76)
                print('PREVIEW_'+str(oid)+'='+base64.b64encode(b.getvalue()).decode(),flush=True)
            except Exception as e: print('ART_ERROR='+str(oid)+' '+str(e),flush=True)
          PY
