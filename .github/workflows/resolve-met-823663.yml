name: Verify special Met image with refreshed small image
on:
  push:
    paths:
      - scripts/resolve_met_823663.py
      - .github/workflows/resolve-met-823663.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-one-image:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install "Pillow>=11,<13"
      - run: python scripts/resolve_met_823663.py
      - run: |
          python scripts/validate_artworks.py
          python scripts/check_image_sources.py
      - name: Save result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: met-823663-followup
          path: docs/met-823663-followup.json
          if-no-files-found: ignore
      - name: Commit on successful verification
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/artworks.json data/image-sources.json docs/met-823663-followup.json
          if ! git diff --cached --quiet; then
            git commit -m "平維盛の別れの原JPEG再照合・展示用高解像度画像を追加"
            git pull --rebase
            git push
          fi
