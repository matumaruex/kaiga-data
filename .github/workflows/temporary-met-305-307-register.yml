name: Temporary register approved artworks 305-307
on:
  push:
    branches: [codex/expand-artworks-305-307-v2]
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Register one audited new artwork at a time
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,subprocess,sys
          from pathlib import Path
          ids=("met-48893","met-694642","met-765654")
          date="2026-11-10"
          def sha(p):return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          for idx,ident in enumerate(ids,1):
            audit_file=Path("docs/artwork-completion-audits/"+ident+"-"+date+".json")
            a=json.loads(audit_file.read_text(encoding="utf-8"))
            assert a["id"]==ident and a["result"]=="PENDING_MACHINE_VERIFICATION"
            a["candidate_sha256"]=sha(a["candidate_path"])
            a["draft_sha256"]=sha(a["draft_path"])
            a["baseline"]={"artworks_sha256":sha("data/artworks.json"),"image_registry_sha256":sha("data/image-sources.json")}
            a["result"]="PASS"
            audit_file.write_text(json.dumps(a,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
            for action in ("preview","save","check"):
              cmd=[sys.executable,"scripts/add_artwork.py",action]
              if action!="check":cmd+=["--audit",str(audit_file)]
              print("RUN",ident,action,flush=True)
              subprocess.run(cmd,check=True)
            print("COMPLETED",ident,304+idx,flush=True)
          assert len(json.loads(Path("data/artworks.json").read_text())["artworks"])==307
          assert "**v2完成登録：307作品**" in Path("README.md").read_text(encoding="utf-8")
          resume=Path("docs/resume-artwork-work.md")
          prev=resume.read_text(encoding="utf-8")
          prefix="""## 【最新の再開地点】2026-11-10：新規候補305〜307件目を登録（PR・CI・main統合確認後に正式確定）

          - 304作品完成後、ユーザーが3作品を指定承認。met-48893 歌川広重《雪中を歩く女性》、met-694642 ウィリアム・A・ハーパー《フランスの木々、午後の早い時間》、met-765654 作者不詳《ヤムナー川岸のクリシュナと牧女たち》を新規追加。
          - 3作品のMet公式作品ページ、object API、作品PD表示、公式Open Access/CC0画像と独自日本語解説を分けて確認した。画像検証GitHub Actions [run 42753854022](https://github.com/matumaruex/kaiga-data/actions/runs/42753854022)で3作品の原画/表示用の全バイトSHA256・寸法・縮小後画素の対応を検証、公式の個別作品画像と図像を照合。met-694642はAPI分類フィールド空だが作品名PaintingとMet個別ページの絵画情報を確認。met-765654はMet API画像URLの空白をHTTP形式へ%20符号化して取得した。作者をナインスークに帰属させず画風との関連にとどめた。
          - 感情索引は歌川広重「孤独」強度2（画面からの鑑賞入口で人物心理の断定ではない）、ハーパーは感情0件、インド作品は「喜び」強度2（宗教的・恋愛的な愛の祝祭に限定）。王の婚礼発注説は仮説として明示。3作品とも独自の日本語説明・選定材料・画像台帳・個別v2監査を保存した。レビューは同一AIの別工程で、独立した人間／別モデルの学術審査とは扱わない。
          - `scripts/add_artwork.py preview → save → check` を各作品で実施し307件へ。既存304件と基準300件の変更なし。最新mainへ統合済みの時だけ307件完成を正式確定し、作品DB・鑑賞下書きのCI合格を確認すること。展示アプリへの配信反映・表示テストは別工程。
          - 次回「続きして」はmain・READMEの最新件数とこの再開メモを先に確認して次の未登録候補へ。

          """
          resume.write_text(prefix+prev,encoding="utf-8")
          PY
          git rm -- .github/workflows/temporary-met-305-307-register.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/artworks.json data/image-sources.json README.md docs/resume-artwork-work.md docs/artwork-completion-audits
          git commit -m "feat: register source-verified works 305-307 with v2 audits"
          git push origin HEAD:codex/expand-artworks-305-307-v2
