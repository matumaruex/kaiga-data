name: Temporary audited Met registration 363-365
on:
  push:
    branches: [codex/expand-artworks-363-365-20261111]
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet requests pillow
      - name: Verify JPEGs, audit three registrations and run full regression tests
        run: |
          python -m py_compile scripts/_temporary_register_363_365.py
          python scripts/_temporary_register_363_365.py
